name: bluebuild
on:
  schedule:
    - cron: "00 06 * * *" # rebuild daily at 06:00 UTC to pick up linux-surface + Bazzite updates
  push:
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch: # allow manually triggering a build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build custom image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # Unsigned build: no cosign key needed. To sign instead, delete this
          # line, uncomment cosign_private_key below, add the SIGNING_SECRET
          # repo secret, and uncomment the "signing" module in recipes/recipe.yml.
          build_opts: "--no-sign"
          # cosign_private_key: ${{ secrets.SIGNING_SECRET }}
