name: build-iso
on:
  workflow_dispatch: # run manually after the image has been built
  workflow_run:
    workflows: ["bluebuild"]
    types: [completed]

jobs:
  iso:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build bootable ISOs
        env:
          # Image names must match "name" in the recipes and your GitHub owner.
          IMAGES: |
            ghcr.io/${{ github.repository_owner }}/fedora-surface-sp4:latest
        run: |
          set -eux
          mkdir -p output
          while read -r IMAGE; do
            [ -n "${IMAGE}" ] || continue
            NAME="$(basename "${IMAGE%%:*}")"
            echo "=== building ISO for ${IMAGE} ==="
            mkdir -p "output/${NAME}"
            sudo podman pull "${IMAGE}"
            sudo podman run --privileged --rm \
              -v "$PWD/output/${NAME}:/output" \
              -v "$PWD/config.toml:/config.toml" \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              quay.io/centos-bootc/bootc-image-builder:latest \
              --type iso --rootfs btrfs --config /config.toml --local "${IMAGE}"
          done <<< "$IMAGES"
          sudo chown -R "$(id -u):$(id -g)" output
          find output -name '*.iso' -printf '%p  (%s bytes)\n'

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: surface-sp4-iso
          path: output/**/*.iso
          if-no-files-found: error
